name: wealth_warden
description: "A Flutter application for managing personal finances."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  material_design_icons_flutter: ^7.0.7296
  path_provider: ^2.1.2
  path: ^1.8.3
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  sqflite: ^2.2.0
  excel: ^4.0.6  # For creating Excel files
  share_plus: ^11.0.0  # For sharing files
  fl_chart: ^0.71.0  # For charts
  local_auth: ^2.1.0  # For biometric auth
  crypto: ^3.0.0     # For encryption
  provider: ^6.0.0   # For state management
  google_sign_in: ^6.2.1  # For Google authentication
  googleapis: ^12.0.0  # For accessing Google APIs
  http: ^1.1.0  # For HTTP requests
  # file_picker: ^5.2.10  # Temporarily disabled due to embedding compatibility issues
  # speech_to_text: ^6.5.1  # Temporarily disabled due to embedding compatibility issues
  # image_picker: ^1.0.7  # Removed - no longer needed for receipt scanning
  # google_mlkit_text_recognition: ^0.11.0  # Removed - no longer needed for OCR on receipts

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # Linting rules for Flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"